{% extends "base.html" %}

{% block title %}
CropSense — Feedback
{% endblock %}

{% block content %}

<div class="page-header">


<h1 data-i18n="feedback_title">
    Feedback
</h1>

<p data-i18n="feedback_text">
    Help us improve CropSense.
</p>

</div>

{% if error %}

<div class="alert alert-error">

⚠️ {{ error }}

</div>

{% endif %}

<div class="form-card">

<form method="POST"
      action="{{ url_for('feedback') }}">


    <div class="form-group">

        <label>
            Rating
        </label>

        <select name="rating">

            <option value="5">
                ⭐⭐⭐⭐⭐ Excellent
            </option>

            <option value="4">
                ⭐⭐⭐⭐ Very Good
            </option>

            <option value="3">
                ⭐⭐⭐ Good
            </option>

            <option value="2">
                ⭐⭐ Needs Improvement
            </option>

            <option value="1">
                ⭐ Poor
            </option>

        </select>

    </div>


    <div class="form-group">

        <label>
            Your Feedback
        </label>

        <textarea
            name="message"
            rows="6"
            required
            placeholder="Write your feedback here..."
            data-i18n-placeholder="feedback_placeholder">
        </textarea>

    </div>


    <div class="form-actions">

        <button
            type="submit"
            class="btn btn-primary btn-full"
            data-i18n="submit_feedback">

            Submit Feedback

        </button>

    </div>


</form>

</div>

{% endblock %}
